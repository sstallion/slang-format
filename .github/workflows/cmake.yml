name: CMake
on:
  workflow_call:
    inputs: &inputs
      os:
        description: Operating system
        required: true
        type: string
      preset:
        description: Workflow preset
        required: true
        type: string
      fetch-tags:
        description: Fetch tags
        required: false
        type: boolean
      upload-artifact:
        description: Upload artifact
        required: false
        type: boolean
      artifact-path:
        description: Artifact path
        required: false
        type: string
  workflow_dispatch:
    inputs: *inputs
jobs:
  cmake:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-tags: ${{ inputs.fetch-tags }}
      - name: Run workflow
        run: cmake --workflow --preset ${{ inputs.preset }}
      - name: Upload artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ inputs.os }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
